<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect fill="#18181b" width="800" height="400"/>
  <defs>
    <filter id="n">
      <feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="800" height="400" filter="url(#n)" opacity=".06"/>
  <rect x="100" y="100" width="600" height="200" rx="4" fill="none" stroke="#b9a4ff" stroke-width=".5" opacity=".15"/>
  <line x1="100" y1="200" x2="700" y2="200" stroke="#b9a4ff" stroke-width=".3" opacity=".1"/>
  <line x1="400" y1="100" x2="400" y2="300" stroke="#b9a4ff" stroke-width=".3" opacity=".1"/>
</svg>
